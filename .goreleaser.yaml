version: 2
project_name: perigee

before:
  hooks:
    - go mod tidy -C agent

builds:
  - id: agent
    dir: agent
    main: .
    binary: perigee
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
    hooks:
      post:
        # macOS only: wraps the binary in "Perigee Files.app" (the script ignores every other system)
        - cmd: sh scripts/make-macapp.sh "{{ .Path }}" "{{ .Os }}" "{{ .Arch }}" "{{ .Version }}"
          dir: .

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

# .deb and .rpm: install the program, a menu entry and the icons
nfpms:
  - id: linux-packages
    package_name: perigee
    vendor: Brand Nova
    homepage: https://brandnova.pythonanywhere.com
    maintainer: Brand Nova <brandnova.dev@gmail.com>
    description: Search and browse your PC's files from your phone, over your own network.
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: packaging/linux/perigee.desktop
        dst: /usr/share/applications/perigee.desktop
      - src: branding/icon-48.png
        dst: /usr/share/icons/hicolor/48x48/apps/perigee.png
      - src: branding/icon-128.png
        dst: /usr/share/icons/hicolor/128x128/apps/perigee.png
      - src: branding/icon-256.png
        dst: /usr/share/icons/hicolor/256x256/apps/perigee.png
      - src: branding/icon-512.png
        dst: /usr/share/icons/hicolor/512x512/apps/perigee.png

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./dist/*.app.zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true      # review notes and attach the APK before publishing
  prerelease: auto # tags like v0.1.0-rc4 are marked as pre-releases
  extra_files:
    - glob: ./dist/*.app.zip